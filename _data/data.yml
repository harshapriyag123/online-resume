  intro: >
    Research prototypes and production-oriented AI systems spanning public health, trustworthy AI, autonomous agents, cloud infrastructure, and human-centered computing.
  assignments:
    - title: CHIP-GIS / GeoRespireAI
      timeframe: 2026
      description: >
        Geospatial public-health platform integrating CDC PLACES, EPA air-quality data, CDC SVI, Census ACS, Landsat 8, and OpenStreetMap. Built an Environmental Exposure Burden Index combining PM2.5, ozone, urban heat, traffic exposure, green space, and social vulnerability, with Random Forest and Gradient Boosting for neighborhood-level respiratory-risk modeling.
      technologies: Python, GIS, Machine Learning, QGIS, PostGIS, FastAPI
