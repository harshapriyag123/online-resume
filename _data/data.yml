      technologies: React, REST APIs, Geolocation, Cloud Deployment
      link: https://github.com/harshapriyag123/shakti360-guardian
    - title: InfraPilot AI
      timeframe: 2026
      description: >
        Cloud-native AI application built for the Zerops x WeMakeDevs challenge with a React frontend, Python/FastAPI backend, production build workflows, and deployed infrastructure.
      technologies: FastAPI, React, Python, Zerops, Cloud AI
      link: https://github.com/harshapriyag123/infrapilot-ai
    - title: GeoShield AI
      timeframe: 2026
