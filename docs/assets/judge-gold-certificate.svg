<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="t d"><title id="t">Technovation Judge Gold Certificate of Recognition — Harsha Priya Ganapathy</title><desc id="d">Certificate recognizing personalized and actionable feedback on 11+ technology projects in the Technovation Girls 2026 season.</desc><rect width="1200" height="850" fill="#fff"/><path d="M940 0v125c0 90 70 160 160 160h100" fill="none" stroke="#dce983" stroke-width="42"/><path d="M1000 0v85c0 75 55 130 130 130h70" fill="none" stroke="#dce983" stroke-width="28"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#201657">TECHNOVATION</text><text x="70" y="325" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#201657">Judge <tspan fill="#e2ae22">Gold</tspan></text><text x="70" y="380" font-family="Arial,sans-serif" font-size="28" letter-spacing="3" fill="#1c2c49">CERTIFICATE OF RECOGNITION</text><rect x="70" y="410" width="135" height="12" fill="#dce983"/><path d="M0 560h390l110 110h-50v180H0z" fill="#201657"/><text x="70" y="690" font-family="Arial,sans-serif" font-size="43" fill="#fff">Building innovators</text><text x="70" y="760" font-family="Georgia,serif" font-size="70" font-style="italic" fill="#dce983">for life</text><text x="650" y="320" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1c2c49">IS AWARDED TO</text><text x="650" y="380" font-family="Arial,sans-serif" font-size="26" fill="#2c2c35">Harsha Priya Ganapathy</text><line x1="650" y1="402" x2="1090" y2="402" stroke="#637084" stroke-width="2"/><text x="650" y="460" font-family="Arial,sans-serif" font-size="21" fill="#34343d"><tspan x="650" dy="0">For dedication to providing personalized and actionable</tspan><tspan x="650" dy="30">feedback on 11+ technology-based projects in the</tspan><tspan x="650" dy="30">Technovation Girls 2026 program season, enriching</tspan><tspan x="650" dy="30">participants' learning journeys.</tspan></text><text x="770" y="690" font-family="Georgia,serif" font-size="42" font-style="italic" fill="#111">Tara Chklovski</text><line x1="730" y1="715" x2="1090" y2="715" stroke="#637084" stroke-width="2"/><text x="780" y="748" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#40506a">Technovation Founder &amp; CEO</text></svg>